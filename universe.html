<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>America in Dots — Data Pulse</title>
  <meta name="description" content="340 million Americans as glowing dots, each placed where people actually live. A short visual story about who lives where, and how old we are.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/universe.css">
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <svg id="borders" aria-hidden="true"><g><path class="mesh"></path><path class="hi"></path></g></svg>
  <div id="labels" class="labels" aria-hidden="true"></div>
  <div id="beacon" class="beacon" hidden><span class="ring"></span><span class="ring r2"></span><span class="tag">You</span></div>

  <header class="bar">
    <a class="back" href="index.html" aria-label="Back to Data Pulse dashboard">← Data Pulse</a>
    <span class="title">America in Dots</span>
    <span class="fresh" id="fresh"></span>
  </header>

  <nav class="progress" id="progress" aria-label="Story steps"></nav>

  <main class="story" id="story">
    <noscript><p class="card">This story needs JavaScript and WebGL.</p></noscript>
  </main>

  <footer class="method" id="method">
    <div class="card">
      <h3>About this data</h3>
      <p id="method-text"></p>
      <p><a href="index.html">Explore the full Age &amp; Sex dashboard →</a></p>
    </div>
  </footer>

  <div id="tip" class="tip" hidden></div>
  <div id="loading" class="loading"><span></span>Placing 340 million people…</div>
  <div id="fallback" class="fallback" hidden>
    <h2>Your browser can't run this one</h2>
    <p>This page needs WebGL2. Try a recent Chrome, Safari, Edge or Firefox, or go back to the <a href="index.html">dashboard</a>.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="assets/universe.js"></script>
</body>
</html>
